services:
  dbt:
    build:
      context: .
      dockerfile: dbt_project/Dockerfile
    volumes:
      - dbt-data:/app/data
    environment:
      - DBT_PROFILES_DIR=/app
      - DUCKDB_PATH=/app/data/invoice_ledger.duckdb

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - dbt-data:/app/data
    depends_on:
      dbt:
        condition: service_completed_successfully
    environment:
      - DUCKDB_PATH=/app/data/invoice_ledger.duckdb
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173}

  dbt-docs:
    image: python:3.12-slim
    ports:
      - "8080:8080"
    volumes:
      - dbt-data:/app/data
    depends_on:
      dbt:
        condition: service_completed_successfully
    command:
      - sh
      - -c
      - "cd /app/data/docs && python -m http.server 8080 --bind 0.0.0.0"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - API_PROXY_TARGET=http://backend:8000
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}

volumes:
  dbt-data:
